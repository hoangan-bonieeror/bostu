name: Deploy to Cloudflare Pages

# The site is private: it is served by Cloudflare Pages and protected by Cloudflare Access
# (only allowed e-mail addresses can open it). See README → "Deploy (private)".
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — API token with the "Cloudflare Pages — Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# Optional repository variable:
#   CF_PAGES_PROJECT       — Pages project name (default: bostu)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Also called by the Tech Radar and daily news bots after they commit a new post.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'bostu' }}
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see README → Deploy)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Latest branch tip (includes commits pushed earlier in a calling workflow).
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate posts and build the index
        run: npm run content

      - name: Build
        run: npm run build

      # Creates the Pages project on the first run; afterwards it already exists, which is fine.
      - name: Ensure the Pages project exists
        continue-on-error: true
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main

      - name: Deploy
        run: |
          npx --yes wrangler@4 pages deploy dist/bostu/browser \
            --project-name="$PROJECT" --branch=main --commit-dirty=true
