<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b93b3"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1c2033" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="340" fill="#fbfbff"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1c2033" text-anchor="start">The life of an HTTP request</text><rect x="30" y="110" width="130" height="150" rx="14" fill="#eceafd" stroke="#c7c4f7" stroke-width="1.5" filter="url(#sh)"/><text x="95" y="175" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1c2033" text-anchor="middle">🖥️</text><text x="95" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c2033" text-anchor="middle">Browser</text><rect x="1040" y="110" width="130" height="150" rx="14" fill="#1e1b4b" stroke="#1e1b4b" stroke-width="1.5" filter="url(#sh)"/><text x="1105" y="175" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1c2033" text-anchor="middle">🗄️</text><text x="1105" y="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Server</text><rect x="190" y="120" width="150" height="130" rx="14" fill="#fff" stroke="#0ea5e9" stroke-width="2" filter="url(#sh)"/><circle cx="220" cy="150" r="16" fill="#0ea5e9"/><text x="220" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="245" y="157" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1c2033" text-anchor="start">DNS</text><text x="265" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#646b85" text-anchor="middle">Domain → IP</text><text x="265" y="222" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#646b85" text-anchor="middle">address</text><line x1="340" y1="185" x2="360" y2="185" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><rect x="360" y="120" width="150" height="130" rx="14" fill="#fff" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/><circle cx="390" cy="150" r="16" fill="#6366f1"/><text x="390" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="415" y="157" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1c2033" text-anchor="start">TCP</text><text x="435" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#646b85" text-anchor="middle">3-way handshake</text><line x1="510" y1="185" x2="530" y2="185" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><rect x="530" y="120" width="150" height="130" rx="14" fill="#fff" stroke="#8b5cf6" stroke-width="2" filter="url(#sh)"/><circle cx="560" cy="150" r="16" fill="#8b5cf6"/><text x="560" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="585" y="157" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1c2033" text-anchor="start">TLS</text><text x="605" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#646b85" text-anchor="middle">Set up encryption</text><line x1="680" y1="185" x2="700" y2="185" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><rect x="700" y="120" width="150" height="130" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/><circle cx="730" cy="150" r="16" fill="#f59e0b"/><text x="730" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="755" y="157" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1c2033" text-anchor="start">Request</text><text x="775" y="200" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="600" fill="#646b85" text-anchor="middle">GET /users/42</text><line x1="850" y1="185" x2="870" y2="185" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><rect x="870" y="120" width="150" height="130" rx="14" fill="#fff" stroke="#22c55e" stroke-width="2" filter="url(#sh)"/><circle cx="900" cy="150" r="16" fill="#22c55e"/><text x="900" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="925" y="157" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1c2033" text-anchor="start">Response</text><text x="945" y="200" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="600" fill="#646b85" text-anchor="middle">200 OK + JSON</text><line x1="160" y1="185" x2="188" y2="185" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><line x1="1032" y1="185" x2="1038" y2="185" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><path d="M1105 270 C 1105 330, 95 330, 95 272" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arr)"/>
</svg>