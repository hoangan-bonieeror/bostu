<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b93b3"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1c2033" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1160" height="400" fill="#fbfbff"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1c2033" text-anchor="start">JOIN types (A = customers, B = orders)</text><rect x="40" y="80" width="260" height="290" rx="14" fill="#fff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><clipPath id="cA0"><circle cx="140" cy="190" r="70"/></clipPath><clipPath id="cB0"><circle cx="200" cy="190" r="70"/></clipPath><circle cx="200" cy="190" r="70" fill="#6d63e8" clip-path="url(#cA0)"/><circle cx="140" cy="190" r="70" fill="none" stroke="#1c2033" stroke-width="2"/><circle cx="200" cy="190" r="70" fill="none" stroke="#1c2033" stroke-width="2"/><text x="105" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1c2033" text-anchor="middle">A</text><text x="235" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1c2033" text-anchor="middle">B</text><text x="170" y="300" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#4f46e5" text-anchor="middle">INNER JOIN</text><text x="170" y="335" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#646b85" text-anchor="middle">Only matching rows</text><rect x="320" y="80" width="260" height="290" rx="14" fill="#fff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><clipPath id="cA1"><circle cx="420" cy="190" r="70"/></clipPath><clipPath id="cB1"><circle cx="480" cy="190" r="70"/></clipPath><circle cx="420" cy="190" r="70" fill="#6d63e8"/><circle cx="420" cy="190" r="70" fill="none" stroke="#1c2033" stroke-width="2"/><circle cx="480" cy="190" r="70" fill="none" stroke="#1c2033" stroke-width="2"/><text x="385" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="515" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1c2033" text-anchor="middle">B</text><text x="450" y="300" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#4f46e5" text-anchor="middle">LEFT JOIN</text><text x="450" y="335" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#646b85" text-anchor="middle">All of A + matches</text><rect x="600" y="80" width="260" height="290" rx="14" fill="#fff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><clipPath id="cA2"><circle cx="700" cy="190" r="70"/></clipPath><clipPath id="cB2"><circle cx="760" cy="190" r="70"/></clipPath><circle cx="700" cy="190" r="70" fill="#6d63e8"/><circle cx="760" cy="190" r="70" fill="#6d63e8"/><circle cx="700" cy="190" r="70" fill="none" stroke="#1c2033" stroke-width="2"/><circle cx="760" cy="190" r="70" fill="none" stroke="#1c2033" stroke-width="2"/><text x="665" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="795" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">B</text><text x="730" y="300" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#4f46e5" text-anchor="middle">FULL OUTER JOIN</text><text x="730" y="335" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#646b85" text-anchor="middle">Everything in A and B</text><rect x="880" y="80" width="260" height="290" rx="14" fill="#fff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><clipPath id="cA3"><circle cx="980" cy="190" r="70"/></clipPath><clipPath id="cB3"><circle cx="1040" cy="190" r="70"/></clipPath><circle cx="980" cy="190" r="70" fill="#6d63e8"/><circle cx="1040" cy="190" r="70" fill="#fff" clip-path="url(#cA3)"/><circle cx="980" cy="190" r="70" fill="none" stroke="#1c2033" stroke-width="2"/><circle cx="1040" cy="190" r="70" fill="none" stroke="#1c2033" stroke-width="2"/><text x="945" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="1075" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1c2033" text-anchor="middle">B</text><text x="1010" y="300" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#4f46e5" text-anchor="middle">LEFT JOIN … IS NULL</text><text x="1010" y="335" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#646b85" text-anchor="middle">Rows in A NOT in B</text>
</svg>