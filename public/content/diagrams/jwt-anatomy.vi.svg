<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b93b3"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1c2033" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1180" height="470" fill="#fbfbff"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1c2033" text-anchor="start">Cấu trúc một JWT</text><rect x="40" y="80" width="1100" height="70" rx="14" fill="#1f0a16" stroke="#1f0a16" stroke-width="1.5" filter="url(#sh)"/><text x="70" y="124" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="22" font-weight="700"><tspan fill="#fb7185">eyJhbGciOiJIUzI1NiJ9</tspan><tspan fill="#fff">.</tspan><tspan fill="#c084fc">eyJzdWIiOiI0MiIsInJvbGUiOiJ1c2VyIn0</tspan><tspan fill="#fff">.</tspan><tspan fill="#38bdf8">SflKxwRJSMeKKF2QT4fwpM</tspan></text><path d="M160 150 L 205.0 188" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="40" y="190" width="330" height="250" rx="14" fill="#fff" stroke="#fb7185" stroke-width="2" filter="url(#sh)"/><path d="M40 204 a14 14 0 0 1 14 -14 h302 a14 14 0 0 1 14 14 v30 h-330 z" fill="#fb7185"/><text x="58" y="220" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="start">Header</text><rect x="56" y="250" width="298" height="130" rx="10" fill="#ffe4ea" stroke="#ffe4ea" stroke-width="1.5"/><text x="70" y="276" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">{</text><text x="70" y="300" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">  "alg": "HS256",</text><text x="70" y="324" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">  "typ": "JWT"</text><text x="70" y="348" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">}</text><text x="205.0" y="418" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#fb7185" text-anchor="middle">Thuật toán ký</text><path d="M520 150 L 580.0 188" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="390" y="190" width="380" height="250" rx="14" fill="#fff" stroke="#a855f7" stroke-width="2" filter="url(#sh)"/><path d="M390 204 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v30 h-380 z" fill="#a855f7"/><text x="408" y="220" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="start">Payload (claims)</text><rect x="406" y="250" width="348" height="130" rx="10" fill="#f3e8ff" stroke="#f3e8ff" stroke-width="1.5"/><text x="420" y="276" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">{</text><text x="420" y="300" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">  "sub": "42",</text><text x="420" y="324" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">  "role": "user",</text><text x="420" y="348" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">  "exp": 1764000000</text><text x="420" y="372" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">}</text><text x="580.0" y="418" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#a855f7" text-anchor="middle">Ai cũng giải mã được — KHÔNG để bí mật!</text><path d="M960 150 L 965.0 188" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="790" y="190" width="350" height="250" rx="14" fill="#fff" stroke="#0ea5e9" stroke-width="2" filter="url(#sh)"/><path d="M790 204 a14 14 0 0 1 14 -14 h322 a14 14 0 0 1 14 14 v30 h-350 z" fill="#0ea5e9"/><text x="808" y="220" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="start">Signature</text><rect x="806" y="250" width="318" height="130" rx="10" fill="#e0f2fe" stroke="#e0f2fe" stroke-width="1.5"/><text x="820" y="276" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">HMACSHA256(</text><text x="820" y="300" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">  base64(header) + "." +</text><text x="820" y="324" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">  base64(payload),</text><text x="820" y="348" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">  SECRET_KEY</text><text x="820" y="372" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#1c2033" text-anchor="start">)</text><text x="965.0" y="418" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0ea5e9" text-anchor="middle">Chống sửa đổi — chỉ server có secret</text>
</svg>