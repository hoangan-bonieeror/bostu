  <rect width="1194" height="300" fill="#fbfbff"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1c2033" text-anchor="start">Thứ tự database thực thi một câu SELECT</text><rect x="40" y="90" width="142" height="110" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><circle cx="62" cy="112" r="13" fill="#1d4ed8"/><text x="62" y="117" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="111" y="150" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">FROM / JOIN</text><text x="111" y="180" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#646b85" text-anchor="middle">lấy &amp; nối bảng</text><line x1="182" y1="145" x2="200" y2="145" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><rect x="202" y="90" width="142" height="110" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/><circle cx="224" cy="112" r="13" fill="#2563eb"/><text x="224" y="117" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="273" y="150" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#2563eb" text-anchor="middle">WHERE</text><text x="273" y="180" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#646b85" text-anchor="middle">lọc từng dòng</text><line x1="344" y1="145" x2="362" y2="145" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><rect x="364" y="90" width="142" height="110" rx="14" fill="#fff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/><circle cx="386" cy="112" r="13" fill="#3b82f6"/><text x="386" y="117" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="435" y="150" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#3b82f6" text-anchor="middle">GROUP BY</text><text x="435" y="180" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#646b85" text-anchor="middle">gom nhóm</text><line x1="506" y1="145" x2="524" y2="145" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><rect x="526" y="90" width="142" height="110" rx="14" fill="#fff" stroke="#0ea5e9" stroke-width="2" filter="url(#sh)"/><circle cx="548" cy="112" r="13" fill="#0ea5e9"/><text x="548" y="117" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="597" y="150" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#0ea5e9" text-anchor="middle">HAVING</text><text x="597" y="180" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#646b85" text-anchor="middle">lọc nhóm</text><line x1="668" y1="145" x2="686" y2="145" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><rect x="688" y="90" width="142" height="110" rx="14" fill="#fff" stroke="#06b6d4" stroke-width="2" filter="url(#sh)"/><circle cx="710" cy="112" r="13" fill="#06b6d4"/><text x="710" y="117" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="759" y="150" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#06b6d4" text-anchor="middle">SELECT</text><text x="759" y="180" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#646b85" text-anchor="middle">chọn cột, alias</text><line x1="830" y1="145" x2="848" y2="145" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><rect x="850" y="90" width="142" height="110" rx="14" fill="#fff" stroke="#14b8a6" stroke-width="2" filter="url(#sh)"/><circle cx="872" cy="112" r="13" fill="#14b8a6"/><text x="872" y="117" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="921" y="150" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#14b8a6" text-anchor="middle">ORDER BY</text><text x="921" y="180" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#646b85" text-anchor="middle">sắp xếp</text><line x1="992" y1="145" x2="1010" y2="145" stroke="#8b93b3" stroke-width="2" marker-end="url(#arr)"/><rect x="1012" y="90" width="142" height="110" rx="14" fill="#fff" stroke="#10b981" stroke-width="2" filter="url(#sh)"/><circle cx="1034" cy="112" r="13" fill="#10b981"/><text x="1034" y="117" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="1083" y="150" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="800" fill="#10b981" text-anchor="middle">LIMIT</text><text x="1083" y="180" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#646b85" text-anchor="middle">giới hạn số dòng</text><rect x="40" y="230" width="1114" height="44" rx="10" fill="#fff6dd" stroke="#f3d98a" stroke-width="1.5"/><text x="597" y="258" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a6100" text-anchor="middle">Bạn VIẾT: SELECT → FROM → WHERE …   Database CHẠY: theo thứ tự trên</text>
