<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/><stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity=".12"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1030" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1080" cy="80" r="220" fill="#ffffff" fill-opacity=".08"/>
  <circle cx="90" cy="600" r="190" fill="#ffffff" fill-opacity=".07"/>

  <g filter="url(#sh)"><rect x="120" y="90" width="420" height="78" rx="18" fill="#ffffff"/><text x="150" y="138" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#065f46">Browser</text><text x="510" y="138" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#065f46" fill-opacity=".75">~0 ms</text></g>
  <g filter="url(#sh)"><rect x="130" y="190" width="400" height="78" rx="18" fill="#ecfccb"/><text x="160" y="238" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#3f6212">CDN</text><text x="500" y="238" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#3f6212" fill-opacity=".75">~10 ms</text></g>
  <g filter="url(#sh)"><rect x="140" y="290" width="380" height="78" rx="18" fill="#ffffff"/><text x="170" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#b91c1c">Redis ⚡</text><text x="490" y="338" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#b91c1c" fill-opacity=".75">~1 ms</text></g>
  <g filter="url(#sh)" transform="translate(150 400)">
    <ellipse cx="180" cy="22" rx="180" ry="22" fill="#d1fae5"/>
    <rect x="0" y="22" width="360" height="100" fill="#ffffff"/>
    <ellipse cx="180" cy="122" rx="180" ry="22" fill="#ffffff"/>
    <ellipse cx="180" cy="22" rx="180" ry="22" fill="#a7f3d0"/>
    <text x="180" y="88" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#065f46">Database</text>
  </g>
  <text x="560" y="520" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#ffffff" fill-opacity=".85">~50 ms</text>
  <!-- bolt -->
  <g filter="url(#sh)"><path d="M860 70 L 720 330 H 830 L 780 560 L 980 260 H 860 L 930 70 Z" fill="#fde047" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/></g>
  <g filter="url(#sh)"><rect x="990" y="150" width="110" height="46" rx="23.0" fill="#16a34a"/><text x="1045" y="181" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#fff">HIT</text></g>
  <g filter="url(#sh)"><rect x="990" y="214" width="110" height="46" rx="23.0" fill="#dc2626"/><text x="1045" y="245" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#fff">MISS</text></g>
  <!-- clock -->
  <g filter="url(#sh)" transform="translate(1000 330)">
    <circle cx="60" cy="60" r="60" fill="#ffffff"/>
    <path d="M60 22 V 60 L 86 76" stroke="#047857" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g filter="url(#sh)"><rect x="985" y="470" width="150" height="46" rx="23.0" fill="#064e3b"/><text x="1060" y="500" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#fff">TTL 300s</text></g>

</svg>